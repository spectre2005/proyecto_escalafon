services:
  app:
    build: ./docker/php
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      SESSION_DRIVER: file
      CACHE_STORE: file
    volumes:
      - ./backend:/var/www/html
      - vendor:/var/www/html/vendor
      - ./docker/php/performance.ini:/usr/local/etc/php/conf.d/zz-performance.ini:ro
    command: sh -c "if [ ! -f vendor/autoload.php ]; then composer install --no-interaction --prefer-dist || exit 1; fi; exec php-fpm"
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  frontend_dependencies:
    build: ./docker/node
    user: "0:0"
    volumes:
      - frontend_node_modules:/app/node_modules
    command: chown -R ${DOCKER_UID:-1000}:${DOCKER_GID:-1000} /app/node_modules

  frontend:
    build: ./docker/node
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      HOME: /tmp
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      frontend_dependencies:
        condition: service_completed_successfully
    command: sh -c "pnpm install && pnpm dev --host"

  db:
    image: postgres:16-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    environment:
      POSTGRES_DB: ${DB_DATABASE:-escalafon}
      POSTGRES_USER: ${DB_USERNAME:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

volumes:
  dbdata:
  vendor:
  frontend_node_modules:
