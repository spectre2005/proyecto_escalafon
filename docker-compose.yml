services:
  app:
    build: ./docker/php
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      SESSION_DRIVER: file
    volumes:
      - ./backend:/var/www/html
      - php_vendor:/var/www/html/vendor
      - ./docker/php/performance.ini:/usr/local/etc/php/conf.d/zz-performance.ini:ro
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  frontend:
    build: ./docker/node
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      HOME: /tmp
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "pnpm install && pnpm dev --host"

  db:
    image: postgres:16-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    environment:
      POSTGRES_DB: ${DB_DATABASE:-escalafon}
      POSTGRES_USER: ${DB_USERNAME:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

volumes:
  dbdata:
  php_vendor:
    name: proyecto_escalafon_vendor
