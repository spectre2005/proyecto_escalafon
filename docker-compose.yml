services:
  app:
    build: ./docker/php
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      SESSION_DRIVER: file
      CACHE_STORE: file
    volumes:
      - ./backend:/var/www/html
      - vendor:/var/www/html/vendor
      - ./docker/php/performance.ini:/usr/local/etc/php/conf.d/zz-performance.ini:ro
    command: sh -c "if [ ! -f vendor/autoload.php ]; then composer install --no-interaction --prefer-dist || exit 1; fi; exec php-fpm"
    # Sano solo con las dependencias instaladas y PHP-FPM escuchando: «up --wait» (iniciar.ps1, README) espera al
    # composer install del primer arranque y no lanza otro a la vez sobre el mismo vendor.
    healthcheck:
      test: ["CMD-SHELL", "test -f vendor/autoload.php && php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 3s
      timeout: 5s
      retries: 3
      start_period: 15m
    depends_on:
      db:
        condition: service_healthy

  # Tareas programadas (legajo:recibir-respuestas cada minuto: lee el Gmail conectado en cada institución). En desarrollo
  # no arranca con «docker compose up -d»: solo con su perfil, p. ej. «docker compose --profile programador up -d scheduler»
  # (README, «Trabajo diario»). Producción lo arranca siempre desde docker-compose.produccion.yml.
  scheduler:
    profiles: ["programador"]
    build: ./docker/php
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      SESSION_DRIVER: file
      CACHE_STORE: file
    volumes:
      - ./backend:/var/www/html
      - vendor:/var/www/html/vendor
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app:
        condition: service_healthy

  frontend_dependencies:
    build: ./docker/node
    user: "0:0"
    volumes:
      - frontend_node_modules:/app/node_modules
    command: chown -R ${DOCKER_UID:-1000}:${DOCKER_GID:-1000} /app/node_modules

  frontend:
    build: ./docker/node
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      HOME: /tmp
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      frontend_dependencies:
        condition: service_completed_successfully
    command: sh -c "pnpm install && pnpm dev --host"

  ollama:
    profiles: ["ia"]
    image: ollama/ollama:latest
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "2"
    volumes:
      - ollama_models:/root/.ollama
    mem_limit: 3g
    cpus: 2
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    environment:
      POSTGRES_DB: ${DB_DATABASE:-escalafon}
      POSTGRES_USER: ${DB_USERNAME:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

volumes:
  ollama_models:
  dbdata:
  vendor:
  frontend_node_modules:
