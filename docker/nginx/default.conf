server {
    listen 80;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 3m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # DNS interno de Docker: «app» se resuelve en cada petición, no solo al arrancar, para seguir funcionando
    # cuando el contenedor app se recrea con otra IP (si no, 502 hasta reiniciar nginx).
    resolver 127.0.0.11 valid=2s ipv6=off;

    location ~ \.php$ {
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
